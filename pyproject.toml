[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-hub"
version = "0.1.0"
description = "Local-first options-positioning (GEX) data hub: MenthorQ & SpotGamma MCP servers, scrapers, and analysis tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "duckdb>=0.10",
  "matplotlib>=3.8",
  "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
py-modules = ["gex_scraper", "positioning_artifact", "plot_spx_gamma"]

[tool.ruff]
line-length = 110
extend-exclude = ["attic"]

[tool.ruff.lint.per-file-ignores]
# BLE001/S110: scraper probes intentionally swallow all exceptions — a failed
# API call must not abort the batch run; narrowing exception types needs a
# behavior review, deferred.
# E701/E702: one-liner style in throwaway probe scripts; E402: sys.path
# bootstrapping before imports is intentional in these scripts.
"scraper/**" = ["BLE001", "S110", "SIM115", "E701", "E702", "E402"]
"gex_scraper.py" = ["BLE001", "S110"]
# BLE001/S110: token refresh helpers return (None, error) tuples by design;
# SIM115: short-lived scripts where open() lifetime is process-scoped.
"spotgamma-mcp/token_refresh.py" = ["BLE001", "S110"]
"mcp/menthorq_mcp.py" = ["BLE001", "S110"]
"mcp/test_all.py" = ["SIM115"]
# E402: sys.path bootstrapping before importing menthorq_mcp is intentional.
"mcp/gen_docs.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
