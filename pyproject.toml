[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-hub"
version = "0.1.0"
description = "Local-first options-positioning (GEX) data hub: MenthorQ & SpotGamma MCP servers, scrapers, and analysis tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "duckdb>=0.10",
  "matplotlib>=3.8",
  "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools]
py-modules = ["gex_scraper", "positioning_artifact", "plot_spx_gamma"]

[tool.ruff]
line-length = 110
extend-exclude = ["attic"]

[tool.ruff.lint.per-file-ignores]
# BLE001/S110: scraper probes intentionally swallow all exceptions — a failed
# API call must not abort the batch run; narrowing exception types needs a
# behavior review, deferred.
"scraper/**" = ["BLE001", "S110", "SIM115"]
"gex_scraper.py" = ["BLE001", "S110"]
# BLE001/S110: token refresh helpers return (None, error) tuples by design;
# SIM115: short-lived scripts where open() lifetime is process-scoped.
"spotgamma-mcp/token_refresh.py" = ["BLE001", "S110"]
"mcp/menthorq_mcp.py" = ["BLE001", "S110"]
"mcp/test_all.py" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: pure-function tests, no subprocess, no sqlite files",
    "integration: stdio subprocess and/or real sqlite file I/O",
    "live: hits real MCP servers and bridge daemon (needs --runlive)",
]

[tool.coverage.run]
source = ["poller"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
